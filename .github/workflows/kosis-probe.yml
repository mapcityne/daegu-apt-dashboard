# KOSIS 통계표 구조 점검 (수동 실행). 키는 출력하지 않는다.
name: kosis-probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - env:
          KOSIS_KEY: ${{ secrets.KOSIS_KEY }}
        run: python -u kosis_probe.py
