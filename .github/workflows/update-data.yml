# 매월 실거래가 수집 → 좌표 변환 → data/*.csv 커밋
# 저장소 Settings > Secrets and variables > Actions 에 DATA_GO_KR_KEY, KAKAO_REST_KEY 등록 필요
name: update-data

on:
  schedule:
    - cron: "17 21 1,15 * *"   # 매월 2일·16일 06:17 (KST)
  workflow_dispatch:            # Actions 탭에서 수동 실행

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 실거래가 수집
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python -u collect.py --months 36
      - name: 단지 좌표 변환
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
        run: python -u geocode.py
      - name: 변경분 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daegu_apt_trades.csv data/complex_coords.csv
          git diff --cached --quiet && exit 0
          git commit -m "data: 실거래가 갱신 $(date +%Y-%m-%d)"
          git pull --rebase origin main
          git push
